name: amaano_bookverse_app
description: Amaano BookVerse Mobile App — user-facing Flutter client for the BookVerse PHP API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  intl: ^0.20.1
  url_launcher: ^6.3.1
  just_audio: ^0.9.42
  syncfusion_flutter_pdfviewer: ^28.1.33
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
